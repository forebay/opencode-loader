name: Test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    uses: intisy/workflows/.github/workflows/test.yml@main
    with:
      toolchains: node
      runners: '["ubuntu-latest","windows-latest","macos-latest"]'
      extra_repositories: |
        forebay/host siblings/host 3249e77e224462ad9ddbb7af6a0fccc86478d8fd
        weivel/model siblings/host/siblings/model 606988fb178b04d3f53835e6d982c09f31081ef1
        weivel/typescript siblings/host/siblings/typescript 00b061bf8acb02c51cd576ecf3074c8e1a15b6d8
      node_install: npm ci --prefix siblings/host/siblings/model && npm ci --prefix siblings/host/siblings/typescript && npm ci --prefix siblings/host && npm run build --prefix siblings/host/siblings/typescript && npm run build --prefix siblings/host && npm install
      node_build: npm run build
      node_test: npm test
