name: Test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    uses: intisy/workflows/.github/workflows/test.yml@main
    with:
      toolchains: node cmake
      runners: '["ubuntu-latest","windows-latest","macos-latest"]'
      extra_repositories: |
        forebay/host siblings/host 07b709ff2ef18c525889bb906d762684d4660e25
        weivel/model siblings/host/siblings/model 606988fb178b04d3f53835e6d982c09f31081ef1
        weivel/typescript siblings/host/siblings/typescript 46bf872abbfcfe164294a9b3daa40fa0c26fff77
        spisor/library siblings/host/siblings/library 801b3f982307a982e02c46bc47f6553426607aff
      node_install: npm ci --prefix siblings/host/siblings/model && npm ci --prefix siblings/host/siblings/typescript && npm ci --prefix siblings/host && npm install
      node_build: cmake -S siblings/host/siblings/library -B siblings/host/siblings/library/build && cmake --build siblings/host/siblings/library/build --config Release && npm run build --prefix siblings/host/siblings/typescript && npm run build --prefix siblings/host && npm run build
      node_test: npm test
      cmake_configure: '-S siblings/host/siblings/library -B siblings/host/siblings/library/build'
      cmake_build: '--build siblings/host/siblings/library/build --config Release'
      cmake_test: ''
